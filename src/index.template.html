 else if(d.an){const a=d.an;if(a=="go")anGo();else if(a=="cancel"||a=="new")anHome();else if(a=="first")anView(0);else if(a=="prev")anView(Math.max(0,ap-1));else if(a=="next")anView(Math.min(AN.mv.length,ap+1));else if(a=="nm")anNext()}
 else if("ply" in d)anView(+d.ply)
 else if(d.pm){mode=d.pm;menu()}
 else if(d.a=="undo"){if(!hs.length||busy)return;const z=hs.pop();while(g.history().length>z.n)g.undo();i=z.i;off=z.off;mis=z.mis;done=false;msg="";note="";hint=null;sel=null;last=null;draw()}
 else if(d.a=="back")menu();
 else if(d.a=="rst")start(LINES.indexOf(L));
 else if(d.a=="next")start((LINES.indexOf(L)+1)%LINES.length);
 else if(d.a=="mode"){learn=!learn;draw()}
 else if(d.a=="hint"){
  if(done||busy)return;
  if(off||i>=L.o.length){think(b=>{const v=b&&g.moves({verbose:true}).find(x=>x.from==b.from&&x.to==b.to&&(!b.promotion||x.promotion==b.promotion));if(v){hm=v;hint=[v.from,v.to];sel=null;msg="Hint: play "+v.san+" (see the arrow).";draw()}},1);return}const m=nxt();hm=m;
  if(m){hint=[m.from,m.to];sel=null;msg="Hint: play "+m.san+" (see the arrow).";draw()}
 }
 else if(d.n)start(+d.n);
 else if(d.side){side=d.side;menu()}
 else if(d.cat){cat=d.cat;menu()}
};
